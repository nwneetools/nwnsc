name: Release Nwnsc Binaries

on:
  pull_request:
  push:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            zip_name: nwnsc-linux
            binary: build/nwnsc/nwnsc
          - os: macos-15
            zip_name: nwnsc-mac
            binary: build/nwnsc/nwnsc
          - os: windows-2022
            zip_name: nwnsc-win
            binary: build/nwnsc/Release/nwnsc.exe
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set version
        run: echo "NWNSC_VERSION=$(git describe --tags --dirty=-dirty --always)" >> "$GITHUB_ENV"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bison
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install bison
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        run: choco install winflexbison --yes --no-progress

      - name: Configure nwnsc
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build nwnsc
        run: cmake --build build --config Release --parallel
      - name: Smoke test
        env:
          BINARY: ${{ matrix.binary }}
        run: |
          # Version/help intentionally exits nonzero; verify its output instead.
          "$BINARY" -v > version.txt 2>&1 || true
          cat version.txt
          grep -F "Usage: version" version.txt

      - name: Create nwnsc archive
        env:
          ZIP_NAME: ${{ matrix.zip_name }}
          BINARY: ${{ matrix.binary }}
        run: |
          mkdir -p artifact staging
          cp "$BINARY" staging/
          cd staging
          cmake -E tar cf "../artifact/${ZIP_NAME}-${NWNSC_VERSION}.zip" --format=zip -- *

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.zip_name }}
          path: artifact/*.zip
          if-no-files-found: error

  release:
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: nwnsc-*
          path: artifact
          merge-multiple: true
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" artifact/*.zip --clobber
